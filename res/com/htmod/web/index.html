<body>
<div id="app">
  <header id="top">
    <button class="key icon-only drawer-btn" id="drawerBtn" title="Radio et options"><svg data-icon="menu"></svg></button>
    <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true"><rect x="1" y="1" width="62" height="62" rx="14" fill="#0A0E13" stroke="#263241" stroke-width="2"/><path d="M10 18V46M10 32H24M24 18V46M30 18H44M37 18V46" fill="none" stroke="#F5A524" stroke-width="5.5" stroke-linecap="round"/><path d="M51 24a10 10 0 0 1 0 16" fill="none" stroke="#5FC8E8" stroke-width="4" stroke-linecap="round"/></svg>

    <div class="grow"></div>
    <div class="conn-state" id="connState"></div>
    <button class="key sound-btn" id="soundBtn" title="Écouter le son du poste dans ce navigateur"><svg data-icon="speaker"></svg><span data-t>SON</span></button>
    <button class="key lang-btn" id="langBtn" title="Changer la langue"></button>
    <button class="key icon-only" id="settingsBtn" title="Réglages et outils"><svg data-icon="sliders"></svg></button>
  </header>
  <aside id="side"></aside>
  <main id="main">
    <nav id="tabs"></nav>
    <section id="views"></section>
  </main>
</div>
<div id="overlay" class="hidden"></div>
